# Corre las pruebas en cada pull request y en cada cambio que llega a main,
# para que un fallo se vea antes de fusionar. Lo que llega a main y pasa las
# pruebas se despliega en Azure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# En un pull request, un push nuevo cancela la ejecución anterior. En main no
# se cancela nada: un despliegue no debe quedar a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (lint y pruebas con MySQL 8)
    runs-on: ubuntu-latest
    services:
      # Mismo motor que producción: los triggers de adopkia_v3 solo existen en
      # MySQL y sus pruebas se omiten en SQLite.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci_only_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Valores de un solo uso: la base vive lo que dura esta ejecución.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "true"
      DB_ENGINE: mysql
      DB_NAME: adopkia
      DB_USER: root
      DB_PASSWORD: ci_only_root_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock.txt
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock.txt
      - name: Lint
        run: python -m ruff check .
      # compose.yaml arranca MySQL con esta opción; aquí se activa en caliente
      # para que las migraciones puedan crear los triggers.
      - name: Permitir la creación de triggers
        run: >-
          mysql --host=127.0.0.1 --user=root --password=ci_only_root_password
          --execute="SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Pruebas
        run: python -m pytest --create-db

  # Publica en Azure lo que llega a main, solo si las pruebas pasaron.
  # GitHub se identifica con una identidad administrada mediante OIDC (sin
  # contraseñas guardadas); infra/setup-github-deploy.sh la crea y define las
  # variables AZURE_* del repositorio. Sin esas variables el trabajo se omite.
  deploy:
    name: Despliegue en Azure
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # Un despliegue en curso termina antes de que empiece el siguiente.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: cradopkiaprodspc
      RESOURCE_GROUP: rg-adopkia-prod-spc
      CONTAINER_APP: ca-adopkia-prod-spc
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir y subir la imagen
        run: |
          IMAGE="$REGISTRY.azurecr.io/adopkia:${GITHUB_SHA::7}"
          az acr login --name "$REGISTRY"
          docker build --file Dockerfile.azure --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      # Solo cambia la imagen: secretos y variables de la aplicación no se tocan.
      - name: Actualizar la aplicación
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --image "$IMAGE" --output none
          FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "APP_URL=https://$FQDN" >> "$GITHUB_ENV"
      # La aplicación escala a cero y aplica migraciones al arrancar: se le da
      # tiempo antes de dar el despliegue por bueno.
      - name: Comprobar que responde
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 60 --output /dev/null "$APP_URL/api/v1/"; then
              echo "La API responde en $APP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "La aplicación no respondió tras el despliegue" >&2
          exit 1
